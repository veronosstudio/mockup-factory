name: Expire previews

# Takes previews down 7 days after they were sent (docs/<business>/expires.txt). Runs daily just after midnight Edmonton.
on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/expire.py
      - name: Commit
        run: |
          git config user.name "veronos-bot"
          git config user.email "bot@veronosstudio.com"
          git add -A docs archive
          git diff --cached --quiet || (git commit -m "Expire previews $(date -u +%F)" && git push)
